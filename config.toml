# Tema de colores de la aplicación (Streamlit lo lee automáticamente).
# Ubicación en el repositorio: .streamlit/config.toml
# Para cambiar de paleta: comenten con # todas las líneas de la paleta activa
# y quiten el # de las líneas de la que quieran usar.

# ---------- PALETA B (activa): gris piedra y turquesa ----------
[theme]
base = "light"
primaryColor = "#1F7A7A"
backgroundColor = "#F3F4F6"
secondaryBackgroundColor = "#E1E4E8"
textColor = "#1F2933"
font = "sans serif"

